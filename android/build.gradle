group = "com.github.mapmetrics.maplibre"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.10"
    repositories {
        google()
        mavenCentral()
        maven { // repository used only for ktlint
            url = uri("https://plugins.gradle.org/m2/")
        }
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
        // noinspection GradleDynamicVersion
        classpath("org.jlleitschuh.gradle:ktlint-gradle:12.2.+")
    }
}

allprojects {
    repositories {
        // mavenLocal() REMOVED. It was here because the plugin depended on
        // mapmetrics-native-sdk 2.0.0, which was never published to Maven
        // Central -- so the build only ever resolved on a machine that had run
        // publishToMavenLocal. Anyone else got an unresolved-dependency failure.
        // 2.0.1 is published, so the dependency resolves from mavenCentral like
        // any other and the build is reproducible on CI again.
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "org.jlleitschuh.gradle.ktlint"

android {
    // Keeping the classes from being removed by proguard.
    defaultConfig {
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    if (project.android.hasProperty("namespace")) {
        namespace = "com.github.mapmetrics.maplibre"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        // mapmetrics-native-sdk 2.x defaults to the Vulkan renderer, which
        // needs Android 7.0. Anything lower fails the manifest merge.
        minSdk = 24
    }

    dependencies {
        // noinspection GradleDynamicVersion
// JNIGEN       implementation project(":MapLibreAndroid")
// JNIGEN        implementation 'com.google.code.gson:gson:2.11.0'
// JNIGEN        implementation 'org.maplibre.gl:maplibre-android-gestures:0.0.3'
// JNIGEN        implementation 'org.maplibre.gl:android-sdk-geojson:6.0.1'
// JNIGEN        implementation 'org.maplibre.gl:android-sdk-turf:6.0.1'
// JNIGEN        implementation 'com.jakewharton.timber:timber:5.0.1'
// JNIGEN        implementation 'androidx.annotation:annotation:1.9.0'
       // 2.0.1 IS A FLOOR, NOT A PREFERENCE. Up to 2.0.0 the SDK sent the
       // opening style-and-tile wave before its async session create landed, so
       // those requests carried only the style's `?token=` and billed once PER
       // TILE. Nothing looks wrong when that happens -- the universal tile
       // endpoint accepts the token as valid v1 auth and returns 200, so the map
       // renders correctly and the cost is silent. Do not drop below 2.0.1.
       //
       // 2.0.0 was also never published to Maven Central (1.0.0-1.0.3, then
       // 2.0.1), which is why this used to need mavenLocal().
       implementation 'org.mapmetrics.android-sdk:mapmetrics-native-sdk:2.0.2' // JNIGEN
//        implementation 'org.maplibre.gl:android-plugin-offline-v9:3.0.2'
// JNIGEN        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.16.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}

ktlint {
    version = "0.43.2"
    android = true
    ignoreFailures = false
    reporters {
        reporter("plain")
        reporter("checkstyle")
    }
    dependencies {
        // noinspection GradleDynamicVersion
        ktlintRuleset("io.nlopez.compose.rules:ktlint:0.4.+")
    }
    filter {
        exclude("**/*.g.kt")
    }
}