allprojects {
    repositories {
        // TODO(dev-only): TEMPORARY — resolves the locally-built
        // org.mapmetrics.android-sdk:mapmetrics-native-sdk from ~/.m2.
        // The transitive dep is resolved on :app's classpath, so it must be
        // declared here as well as in the plugin's android/build.gradle.
        // MUST be removed before release; builds are not reproducible with it.
        mavenLocal()
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

apply plugin: "org.jlleitschuh.gradle.ktlint"

ktlint {
    version = "0.43.2"
    android = true
    ignoreFailures = false
    reporters {
        reporter("plain")
        reporter("checkstyle")
    }
    dependencies {
        // noinspection GradleDynamicVersion
        ktlintRuleset("io.nlopez.compose.rules:ktlint:0.4.+")
    }
    filter {
        exclude("**/*.g.kt")
    }
}